name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check canopen_generator tests
      - run: uv run black --check canopen_generator tests
      - run: uv run pytest

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lib
      - run: make test
      - run: ./build/tests

  format:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: clang-format --dry-run -Werror src/*.cpp src/*.hpp tests/cpp/*.cpp tests/cpp/fake-hardware.hpp
