[project]
name = "canopen-stack-slave"
version = "0.1.0"
description = "CANopen slave library with autogeneration of EDS file"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Adrien Cardinale", email = "adrien.cardinale@heig-vd.ch" },
    { name = "Yves Chevallier", email = "yves.chevallier@heig-vd.ch" },
    { name = "Tristan Liebeherr" },
]
dependencies = [
    "click>=8.1.8,<9",
    "jinja2>=3.1.6,<4",
    "pyyaml>=6.0.2,<7",
    "voluptuous>=0.15.2,<0.16",
    "mdformat>=0.7.22,<0.8",
    "mdformat-tables>=1.0.0,<2",
]

[project.scripts]
can-meta-generator = "canopen_generator.__main__:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-cov>=6.0,<7",
    "pytest-timeout>=2.3,<3",
    "black>=25.0.0,<26",
    "ruff>=0.9.9,<0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canopen_generator"]

[tool.pytest.ini_options]
addopts = "--cov=canopen_generator --cov-report term-missing"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C", "I", "B"]
ignore = ["E501", "C901"]
